<div class="layout-container">
  <!-- Left Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">📦</span>
        <span class="logo-text" *ngIf="!sidebarCollapsed">InventoryProc</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <span *ngIf="!sidebarCollapsed">◀</span>
        <span *ngIf="sidebarCollapsed">▶</span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item" *ngFor="let item of menuItems">
        <div
          class="nav-link"
          [routerLink]="!item.children ? item.route : null"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          (click)="toggleMenuItem(item)"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
          <span
            class="nav-arrow"
            *ngIf="item.children && !sidebarCollapsed"
            [class.expanded]="item.expanded"
          >
            ▼
          </span>
        </div>

        <div
          class="nav-submenu"
          *ngIf="item.children && item.expanded && !sidebarCollapsed"
        >
          <div
            class="nav-link submenu-link"
            *ngFor="let child of item.children"
            [routerLink]="child.route"
            routerLinkActive="active"
          >
            <span class="nav-icon">{{ child.icon }}</span>
            <span class="nav-label">{{ child.label }}</span>
          </div>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content" [class.expanded]="sidebarCollapsed">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h2 class="page-title">{{ getPageTitle() }}</h2>
      </div>
      <div class="top-bar-right">
        <div class="user-info" *ngIf="currentUser">
          <span class="user-name"
            >{{ currentUser.firstName }} {{ currentUser.lastName }}</span
          >
          <span class="user-role">({{ currentUser.role }})</span>
        </div>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
